<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="400" height="400" rx="56" fill="url(#bgGrad)"/>

  <!-- Subtle orange glow behind text -->
  <ellipse cx="200" cy="190" rx="160" ry="90" fill="#f97316" opacity="0.07"/>

  <!-- EBK main text -->
  <text
    x="200"
    y="240"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="168"
    font-weight="900"
    fill="url(#letterGrad)"
    text-anchor="middle"
    letter-spacing="-4"
  >EBK</text>

  <!-- Underline bar -->
  <rect x="80" y="262" width="240" height="6" rx="3" fill="#f97316" opacity="0.5"/>

  <!-- Tagline -->
  <text
    x="200"
    y="318"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="700"
    fill="#6b7280"
    text-anchor="middle"
    letter-spacing="5"
  >ELITE BALL KNOWLEDGE</text>
</svg>
